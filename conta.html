    <center>
        <p class="display-2">Faça seu cadastro para começar a comprar.</p>
    </center>

    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-3">
                
            </div>
            <div class="col-sm-6">
                <form action="https://formsubmit.co/pedrox2102@gmail.com" method="post" id="form_cadastro" onsubmit="criar_cadastro()">
                    <fieldset>
                        <legend id="start_legend">- Por favor, cadastre suas informações</legend>
                        <b><label class="label_class">Nome:</label></b>
                        <input type="text" name="nome" class="input_text" id="nome_input"/>
                    </fieldset>
                    <fieldset>
                        <b><label class="label_class">Endereço:</label></b>
                        <input type="text" name="endereço" class="input_text" id="endereco_input"/>
                    </fieldset>
                    <fieldset>
                        <b><label class="label_class">Sexo:</label></b>
                        <label class="label_class">Masculino</label>
                        <input type="radio" name="sexo" value="masculino" checked/>
                        <label class="label_class bottom_class">Feminino</label>
                        <input type="radio" name="sexo" value="feminino"/>
                    </fieldset>
                    <fieldset>
                        <b><label class="label_class">CPF:</label></b>
                        <input type="tel" class="input_text" name="cpf" placeholder="XXXXXXXXXXX" pattern="[0-9]{11}" id="cpf_input" required/>
                    </fieldset>
                    <fieldset>
                        <b><label class="label_class">Telefone:</label></b>
                        <input type="tel" class="input_text" name="telefone" placeholder="ddXXXXXXXXX" pattern="[0-9]{11}" id="telefone_input" required/>
                    </fieldset>
                    <fieldset>
                        <b><label class="label_class">Email:</label></b>
                        <input type="email" class="input_text" name="email" placeholder="example@email.com" id="email_input" required/>
                    </fieldset>
                    <fieldset>
                        <b><label class="label_class">Nascimento:</label></b>
                        <input type="date" name="data_nascimento" id="nascimento_input"/>
                    </fieldset>
                    <fieldset>
                        <input type="submit" value="Criar Conta" class="btn btn-primary btn_servico" id="criar"/>
                        <input type="button" value="Cancelar" class="btn btn-primary btn_servico" id="cancelar" onclick="clear_form()"/>
                    </fieldset>
                </form>
            </div>
            <div class="col-sm-3">
                <img src="assets/images/logo_minimercado.png" id="logo_mercado">
            </div>
        </div>
    </div>

    <script>
        function criar_cadastro(){
            alert("Obrigado por se cadastrar no MiniMercado 24h");
        }

        function clear_form(){
            document.getElementById("form_cadastro").reset();
        }
    </script>
